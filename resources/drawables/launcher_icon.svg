<svg width="192" height="192" viewBox="0 0 192 192" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient (space theme) -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f3460;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#00d4ff;stop-opacity:0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <circle cx="96" cy="96" r="96" fill="url(#bgGrad)" />
  <circle cx="96" cy="96" r="96" fill="url(#glowGrad)" />

  <!-- Warp effect circles -->
  <g stroke="#00d4ff" stroke-width="1.5" fill="none" opacity="0.3">
    <circle cx="96" cy="96" r="25" />
    <circle cx="96" cy="96" r="40" />
    <circle cx="96" cy="96" r="55" />
  </g>

  <!-- Game controller outline -->
  <g>
    <!-- Left D-pad -->
    <rect x="36" y="78" width="14" height="36" fill="#00d4ff" rx="2" />
    <rect x="22" y="92" width="42" height="14" fill="#00d4ff" rx="2" />

    <!-- Right buttons (colored for visual interest) -->
    <circle cx="154" cy="78" r="7" fill="#ff006e" />
    <circle cx="154" cy="110" r="7" fill="#ffbe0b" />
    <circle cx="138" cy="94" r="7" fill="#3a86ff" />
    <circle cx="170" cy="94" r="7" fill="#06ffa5" />

    <!-- Center display window -->
    <rect x="64" y="56" width="64" height="64" fill="none" stroke="#00d4ff" stroke-width="2.5" rx="6" opacity="0.8" />

    <!-- Inner accent -->
    <rect x="68" y="60" width="56" height="56" fill="none" stroke="#00d4ff" stroke-width="1" rx="4" opacity="0.4" />

    <!-- Center crosshair (game focus indicator) -->
    <g stroke="#00d4ff" stroke-width="2" opacity="0.7">
      <line x1="96" y1="72" x2="96" y2="82" />
      <line x1="96" y1="110" x2="96" y2="120" />
      <line x1="82" y1="96" x2="72" y2="96" />
      <line x1="120" y1="96" x2="110" y2="96" />
    </g>

    <!-- Glow rings around buttons -->
    <circle cx="154" cy="78" r="10" fill="none" stroke="#ff006e" stroke-width="1" opacity="0.3" />
    <circle cx="154" cy="110" r="10" fill="none" stroke="#ffbe0b" stroke-width="1" opacity="0.3" />
  </g>

  <!-- Bottom expansion indicator (for future games) -->
  <g opacity="0.6">
    <rect x="44" y="142" width="104" height="3" fill="#00d4ff" rx="1.5" />
    <rect x="50" y="149" width="28" height="2" fill="#00d4ff" opacity="0.5" />
    <rect x="82" y="149" width="28" height="2" fill="#00d4ff" opacity="0.5" />
    <rect x="114" y="149" width="28" height="2" fill="#00d4ff" opacity="0.5" />
  </g>
</svg>
